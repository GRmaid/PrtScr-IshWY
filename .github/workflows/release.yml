name: Release

# 只有主人明确同意后才能触发（tag 或 workflow_dispatch）。
# 版本输入一律经 env 传入，先在 PowerShell 内严格校验，再写 GITHUB_OUTPUT（B1）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本，例如 1.3.1 或 v1.3.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve and validate version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/lib/SourceIdentity.ps1

          # 不可信输入只从 env 读；不插入脚本正文，也不在校验前写入 GITHUB_OUTPUT。
          $raw = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $version = ConvertTo-StrictVersion $raw   # 只规范化一个前导 v，其余非法形状直接抛错

          if ($env:EVENT_NAME -eq 'push') {
              $tag = 'v' + $version
              if ($env:REF_NAME -cne $tag) {
                  throw "tag '$($env:REF_NAME)' 与版本 '$version' 不一致（期望 '$tag'）"
              }
              git check-ref-format "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { throw "非法的 tag 引用：$tag" }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "release version = $version"

      - name: Gate (release)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/gate.ps1 -Mode release -Version $env:VERSION

      # 证据无条件上传：失败时才能看到 logs/、manifest 与 smoke 原始结果（B5）。
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prtscr-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: prtscr-release-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/IshWY-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v' + $env:VERSION
          $zip = Join-Path 'artifacts' ("IshWY-{0}-win-x64.zip" -f $env:VERSION)
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
              throw "缺少本次发布包：$zip"
          }
          # 参数全部来自已校验变量；gh 命令内不做任何表达式插值。
          if ($env:IS_TAG_PUSH -eq 'true') {
              gh release create $tag $zip --title $tag --notes "Release $tag"
          }
          else {
              gh release create $tag $zip --title $tag --notes "Release $tag" --target $env:GITHUB_SHA
          }

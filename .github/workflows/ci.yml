name: CI

# 严格门禁（P11 方案 A）：CI 跑完整 gate，包含 smoke 与本次 ZIP 生成。
# 不允许 -SkipSmoke / -NoZip：那两条路径只能得到 LIMITED，不能代表发布验收。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (strict)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Gate
        shell: pwsh
        run: ./scripts/gate.ps1 -Mode ci -Version 0.0.0-ci

      # 证据必须无条件上传，否则失败时恰恰看不到日志与 manifest（B5）。
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prtscr-gate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/evidence
          if-no-files-found: warn
          retention-days: 14
